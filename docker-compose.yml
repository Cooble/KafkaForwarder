name: kafka-forwarder

services:
  kafka:
    container_name: kafka
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    env_file:
      .env

  postgres:
    container_name: postgres
    image: postgres:17
    env_file:
      .env
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test -d brokerdb" ]
      interval: 5s
      timeout: 5s
      retries: 5
