spring.application.name=client
server.port=8082

# Forwarder configuration
forwarder.url=ws://localhost:8081/ws
client.url=http://localhost:8082
client.subscribed.topics=topic1

# Auto-register on startup
client.auto.register=true

# Registration retry configuration
client.registration.retry.max.attempts=5
client.registration.retry.delay.ms=2000

# Artificial processing delay (ms) added before sending confirmation
client.processing.delay.ms=500
# Random jitter added to the delay (0 to this value)
client.processing.delay.jitter.ms=200

# Optional: override client identifier (defaults to IP address)
# client.identifier=client-001

