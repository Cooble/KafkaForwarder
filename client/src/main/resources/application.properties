# Client application properties
# Configure transport mode, toggle toxiproxy, forwarder URL and registration behaviour.

spring.application.name=client
server.port=8082


# Enable toxiproxy port overrides (comment out to disable)
spring.profiles.active=toxiproxy


# Transport Mode: 'rest' or 'websocket'
# Must match the forwarder's transport mode
client.transport.mode=rest

# Forwarder configuration
forwarder.url=http://localhost:8081
client.url=http://localhost:8082
client.subscribed.topics=topic1

# WebSocket configuration (used when client.transport.mode=websocket)
forwarder.websocket.url=ws://localhost:8081/ws
client.websocket.reconnect.max.attempts=10
client.websocket.reconnect.delay.ms=2000

# WebSocket message size limits (increase for large batches)
spring.websocket.max-text-message-size=1048576
spring.websocket.max-binary-message-size=1048576

# Auto-register on startup
client.auto.register=true

# Registration retry configuration
client.registration.retry.max.attempts=5
client.registration.retry.delay.ms=2000

# Optional: override client identifier (defaults to IP address)
# client.identifier=client-001

