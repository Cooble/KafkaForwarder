spring.application.name="event-producer"

# Kafka config
spring.kafka.bootstrap-servers=localhost:9092
kafka.topics=topic1,topic2
producer.rate.period.ms=2000
# Set to false to disable the fixed-rate scheduler (useful when running bursts only)
producer.scheduler.enabled=false
# Number of events to push at maximum speed right after startup
producer.burst.count=10000
# Controls whether the burst should run on startup
producer.burst.run-on-startup=true