spring.application.name="event-producer"

# Kafka config
spring.kafka.bootstrap-servers=localhost:9092
kafka.topics=topic1,topic2


# Enable ramp-up mode (false = constant rate at start.rate)
rampup.enabled=true

# Starting emission rate (events per second)
rampup.start.rate=4400

# Target emission rate at the end of ramp-up (events per second)
rampup.end.rate=5000

# Duration of the ramp-up period in seconds
rampup.duration.seconds=60

# Whether the producer stops after the ramp-up period completes
rampup.stop.after=true
