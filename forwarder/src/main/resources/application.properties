# Forwarder application properties
# Controls transport mode, Kafka consumer, DB profile, client communication and performance tuning.

spring.application.name=http-forwarder
# Set a different port so it doesn't conflict with the producer
server.port=8081

# Transport Mode: 'rest' or 'websocket'
# Determines how the forwarder communicates with clients
forwarder.transport.mode=rest

# Database Profile Selection: 'postgres' or 'h2'
# Change this to 'h2' for in-memory database, 'postgres' for persistent PostgreSQL
spring.profiles.active=h2

## Kafka config
spring.kafka.bootstrap-servers=localhost:9092
kafka.topics=topic1
# A "group of consumers" is defined by this ID; it ensures that an event will be delivered ONCE to only ONE consumer from this group
spring.kafka.consumer.group-id=main_group
# Start reading from earliest message if no offset is stored (important for testing)
spring.kafka.consumer.auto-offset-reset=earliest

# Kafka Consumer Batch Configuration (for high throughput)
# Maximum number of records returned in a single poll
spring.kafka.consumer.max-poll-records=1000
# Fetch at least this many bytes (waits for more data if needed)
spring.kafka.consumer.fetch-min-size=1048576
# Maximum wait time to accumulate fetch-min-size bytes (50ms)
spring.kafka.consumer.fetch-max-wait=50ms
# Maximum bytes per partition (10MB)
spring.kafka.consumer.max-partition-fetch-bytes=10485760
# Enable batch listener mode
spring.kafka.listener.type=batch
# Run 10 Kafka consumer threads in parallel for maximum throughput
spring.kafka.listener.concurrency=10
# Manual acknowledgment - we commit ONLY after DB persistence completes (prevents data loss)
spring.kafka.listener.ack-mode=manual

# Batch processing configuration
# How many events to batch before writing to DB (higher = better throughput, slightly higher latency)
kafka.batch.size=500
# Batch size for database queries with IN clauses (to avoid H2 parameter limits)
db.query.batch.size=100

## Default connection pool (used by both profiles)
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=20
spring.datasource.hikari.minimumIdle=10


# Very important for batch inserts/updates performance
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Database-specific settings are in application-{profile}.properties

## Retry configuration (all timings in milliseconds)
# Interval between retry checks
forwarder.retry.check.interval.ms=5000
# Grace period before retrying - events younger than this are still awaiting ACK
forwarder.retry.grace.period.ms=10000
# How long to wait before retrying a failed delivery
forwarder.retry.interval.ms=5000
# Maximum number of delivery attempts
forwarder.retry.max.attempts=5

## Client communication
# Timeout for HTTP requests to clients (REST mode only)
forwarder.client.timeout.ms=10000
# Maximum number of events to send in a single HTTP request (prevents huge payloads)
forwarder.client.max.batch.size=100
# Maximum number of concurrent HTTP requests (prevents connection pool overflow - REST mode only)
forwarder.client.max.concurrent.requests=500

## WebSocket configuration (used when forwarder.transport.mode=websocket)
# WebSocket endpoint path
forwarder.websocket.endpoint=/ws
# Timeout for WebSocket message acknowledgment
forwarder.websocket.ack.timeout.ms=10000
# Heartbeat interval to detect dead connections
forwarder.websocket.heartbeat.interval.ms=30000

# WebSocket message size limits (increase for large batches)
spring.websocket.max-text-message-size=1048576
spring.websocket.max-binary-message-size=1048576
server.tomcat.max-swallow-size=-1

# Note: Producer ramp configuration is in rampup.properties
