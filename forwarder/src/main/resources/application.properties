spring.application.name=http-forwarder
# Set a different port so it doesn't conflict with the producer
server.port=8081

## Kafka config
spring.kafka.bootstrap-servers=localhost:9092
kafka.topics=topic1
# A "group of consumers" is defined by this ID; it ensures that an event will be delivered ONCE to only ONE consumer from this group
spring.kafka.consumer.group-id=main_group

## default connection pool
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5
## PostgreSQL (Doesn't work if docker container is on default port 5432 ???)
# (wslrelay.exe is stealing port 5432 on localhost (!) )
spring.datasource.url=jdbc:postgresql://localhost:5001/brokerdb
spring.datasource.username=test
spring.datasource.password=test
# update: Keep existing data and update schema if needed (production-ready)
# create-drop: Drop and recreate tables on restart (only for testing - loses all data!)
spring.jpa.hibernate.ddl-auto=update

## Retry configuration (all timings in milliseconds)
# Interval between retry checks
forwarder.retry.check.interval.ms=5000
# How long to wait before retrying a failed delivery
forwarder.retry.interval.ms=5000
# Maximum number of delivery attempts
forwarder.retry.max.attempts=5

## Client communication
# Timeout for HTTP requests to clients
forwarder.client.timeout.ms=10000

