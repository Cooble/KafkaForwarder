# H2 Database Configuration (Docker Container)
spring.datasource.url=jdbc:h2:tcp://localhost:9093//opt/h2-data/brokerdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
jakarta.persistence.jdbc.url=jdbc:h2:tcp://localhost:9093//opt/h2-data/brokerdb

# Always recreate schema for H2 database
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Note: H2 web console runs in the docker container at http://localhost:8083
spring.h2.console.enabled=false



